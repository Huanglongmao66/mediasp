# Gradle JVM 参数配置 - 分配足够的内存给Gradle守护进程
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# 启用Gradle并行构建
org.gradle.parallel=true

# 启用Gradle缓存
org.gradle.caching=true

# 启用按需配置
org.gradle.configureondemand=true

# AndroidX 配置
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 代码风格配置
kotlin.code.style=official

# Compose Multiplatform 配置
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true

# iOS 相关配置
kotlin.native.cocoapods.generate.wrapper=true

# Maven 仓库配置
mavenCentralRepositoryUrl=https://repo1.maven.org/maven2/

# 使用系统已安装的 Yarn
kotlin.js.yarn.useSystemBinary=true

# 忽略无法构建的 Native 目标
kotlin.native.ignoreDisabledTargets=true

# 禁用默认 Kotlin 层级模板
kotlin.mpp.applyDefaultHierarchyTemplate=false

# HTTP/HTTPS 代理配置（沙箱环境）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.https.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local

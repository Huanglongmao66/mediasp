name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Windows MSI installer
        run: gradlew.bat :desktopApp:packageMsi --no-daemon

      - name: Build Windows EXE installer
        run: gradlew.bat :desktopApp:packageExe --no-daemon

      - name: Build Windows JAR
        run: gradlew.bat :desktopApp:packageUberJarForCurrentOS --no-daemon

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 30

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          retention-days: 30

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-jar
          path: desktopApp/build/compose/jars/*.jar
          retention-days: 30

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: ./artifacts/msi

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./artifacts/exe

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: MultiPlatform Video Player v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## MultiPlatform Video Player v${{ steps.get_version.outputs.VERSION }}

            ### Windows
            - Download `MultiPlatformVideoPlayer-${{ steps.get_version.outputs.VERSION }}.msi` for MSI installer
            - Download `MultiPlatformVideoPlayer-${{ steps.get_version.outputs.VERSION }}.exe` for EXE installer

            ### Installation
            1. Download the installer
            2. Run the installer and follow the prompts
            3. Launch MultiPlatform Video Player from the Start Menu

            ### System Requirements
            - Windows 10 or later
            - 64-bit system
          files: |
            ./artifacts/**/*.msi
            ./artifacts/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

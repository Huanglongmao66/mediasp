name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  # ============ Android APK 构建 ============
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: |
          ./gradlew :androidApp:assembleRelease \
            -Dhttp.proxyHost= \
            -Dhttp.proxyPort= \
            -Dhttps.proxyHost= \
            -Dhttps.proxyPort= \
            -Dhttp.nonProxyHosts= \
            -Dhttps.nonProxyHosts= \
            --no-daemon

      - name: Build Android Debug APK
        run: |
          ./gradlew :androidApp:assembleDebug \
            -Dhttp.proxyHost= \
            -Dhttp.proxyPort= \
            -Dhttps.proxyHost= \
            -Dhttps.proxyPort= \
            -Dhttp.nonProxyHosts= \
            -Dhttps.nonProxyHosts= \
            --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============ Windows 桌面构建 ============
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Windows installers
        run: |
          .\gradlew.bat :desktopApp:packageMsi -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon
          .\gradlew.bat :desktopApp:packageExe -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon
          .\gradlew.bat :desktopApp:packageUberJarForCurrentOS -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 30

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          retention-days: 30

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-jar
          path: desktopApp/build/compose/jars/*.jar
          retention-days: 30

  # ============ Linux 桌面构建 ============
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install fakeroot for DEB packaging
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux packages
        run: |
          ./gradlew :desktopApp:packageDeb -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon
          ./gradlew :desktopApp:packageAppImage -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon
          ./gradlew :desktopApp:packageUberJarForCurrentOS -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          retention-days: 30

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: desktopApp/build/compose/binaries/main/app/*.AppImage
          retention-days: 30

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-jar
          path: desktopApp/build/compose/jars/*.jar
          retention-days: 30

  # ============ macOS 桌面构建 ============
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS packages
        run: |
          ./gradlew :desktopApp:packageDmg -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon
          ./gradlew :desktopApp:packageUberJarForCurrentOS -Dhttp.proxyHost= -Dhttp.proxyPort= -Dhttps.proxyHost= -Dhttps.proxyPort= -Dhttp.nonProxyHosts= -Dhttps.nonProxyHosts= --no-daemon

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 30

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-jar
          path: desktopApp/build/compose/jars/*.jar
          retention-days: 30

  # ============ 创建 GitHub Release（仅在 tag 推送时） ============
  create-release:
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: List all artifacts
        run: find ./artifacts -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.jar" \)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: MultiPlatform Video Player v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## MultiPlatform Video Player v${{ steps.get_version.outputs.VERSION }}

            ### Android
            - `androidApp-release-unsigned.apk` - Android Release APK
            - `androidApp-debug.apk` - Android Debug APK

            ### Windows
            - `MultiPlatformVideoPlayer-${{ steps.get_version.outputs.VERSION }}.msi` - MSI Installer
            - `MultiPlatformVideoPlayer-${{ steps.get_version.outputs.VERSION }}.exe` - EXE Installer

            ### Linux
            - `multiplatformvideoplayer_${{ steps.get_version.outputs.VERSION }}-1_amd64.deb` - Debian/Ubuntu Package
            - `MultiPlatformVideoPlayer-${{ steps.get_version.outputs.VERSION }}.AppImage` - Portable AppImage

            ### macOS
            - `MultiPlatformVideoPlayer-${{ steps.get_version.outputs.VERSION }}.dmg` - DMG Installer

            ### Universal JAR
            - `MultiPlatformVideoPlayer-*-x64-${{ steps.get_version.outputs.VERSION }}.jar` - Run with `java -jar`

            ## Installation Instructions

            ### Android
            1. Download the APK file
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK

            ### Windows
            1. Download the MSI or EXE installer
            2. Run the installer and follow the prompts
            3. Launch from Start Menu

            ### Linux (Debian/Ubuntu)
            ```bash
            sudo dpkg -i multiplatformvideoplayer_${{ steps.get_version.outputs.VERSION }}-1_amd64.deb
            ```

            ### macOS
            1. Download the DMG file
            2. Open and drag to Applications folder
            3. Launch from Applications

            ## System Requirements
            - Android 7.0+ (API 24+)
            - Windows 10+ / Ubuntu 20.04+ / macOS 11+
            - 64-bit system
            - Java 17+ (for JAR version)
          files: |
            ./artifacts/**/*.apk
            ./artifacts/**/*.msi
            ./artifacts/**/*.exe
            ./artifacts/**/*.deb
            ./artifacts/**/*.AppImage
            ./artifacts/**/*.dmg
            ./artifacts/**/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
